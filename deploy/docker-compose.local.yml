services:
  agent-canvas:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-agent-canvas:staging}
    container_name: agent-canvas-staging
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - ../.env
    environment:
      SQLITE_PATH: /app/data/agent-canvas.sqlite
    volumes:
      - agent-canvas-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent-canvas-data:
