stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:staging"
  PNPM_VERSION: "10.12.4"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feature/mcp-app-widget-host"

validate:typecheck:
  stage: validate
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feature/mcp-app-widget-host"

validate:lint:
  stage: validate
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feature/mcp-app-widget-host"

build:image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feature/mcp-app-widget-host"

deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build:image
  before_script:
    - apk add --no-cache openssh-client bash curl
    - bash deploy/scripts/ci-setup-ssh.sh
  script:
    - scp deploy/docker-compose.staging.yml "${STAGING_USER}@${STAGING_HOST}:${STAGING_DEPLOY_PATH}/docker-compose.yml"
    - scp deploy/scripts/remote-deploy.sh "${STAGING_USER}@${STAGING_HOST}:${STAGING_DEPLOY_PATH}/remote-deploy.sh"
    - |
      ssh "${STAGING_USER}@${STAGING_HOST}" \
        "STAGING_DEPLOY_PATH=${STAGING_DEPLOY_PATH} \
         IMAGE_TAG=${IMAGE_LATEST} \
         APP_PORT=${APP_PORT:-3000} \
         CI_REGISTRY=${CI_REGISTRY} \
         CI_REGISTRY_USER=${CI_REGISTRY_USER} \
         CI_REGISTRY_PASSWORD=${CI_REGISTRY_PASSWORD} \
         TURING_API_BASE=${TURING_API_BASE} \
         TURING_API_KEY=${TURING_API_KEY} \
         TURING_MODEL=${TURING_MODEL} \
         OPENAI_API_KEY=${OPENAI_API_KEY} \
         OPENAI_BASE_URL=${OPENAI_BASE_URL} \
         OPENAI_MODEL=${OPENAI_MODEL} \
         OPENAI_API=${OPENAI_API} \
         MCP_SERVER_URL=${MCP_SERVER_URL} \
         MCP_SERVER_NAME=${MCP_SERVER_NAME} \
         MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN} \
         MCP_TIMEOUT_MS=${MCP_TIMEOUT_MS} \
         FLUXINK_HWR_UI_RESOURCE_URI=${FLUXINK_HWR_UI_RESOURCE_URI} \
         PORTAL_FRAME_ANCESTOR_ORIGIN=${PORTAL_FRAME_ANCESTOR_ORIGIN} \
         bash ${STAGING_DEPLOY_PATH}/remote-deploy.sh"
  environment:
    name: staging
    url: $STAGING_PUBLIC_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feature/mcp-app-widget-host"

deploy:staging:manual:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build:image
  when: manual
  before_script:
    - apk add --no-cache openssh-client bash curl
    - bash deploy/scripts/ci-setup-ssh.sh
  script:
    - scp deploy/docker-compose.staging.yml "${STAGING_USER}@${STAGING_HOST}:${STAGING_DEPLOY_PATH}/docker-compose.yml"
    - scp deploy/scripts/remote-deploy.sh "${STAGING_USER}@${STAGING_HOST}:${STAGING_DEPLOY_PATH}/remote-deploy.sh"
    - |
      ssh "${STAGING_USER}@${STAGING_HOST}" \
        "STAGING_DEPLOY_PATH=${STAGING_DEPLOY_PATH} \
         IMAGE_TAG=${IMAGE_LATEST} \
         APP_PORT=${APP_PORT:-3000} \
         CI_REGISTRY=${CI_REGISTRY} \
         CI_REGISTRY_USER=${CI_REGISTRY_USER} \
         CI_REGISTRY_PASSWORD=${CI_REGISTRY_PASSWORD} \
         TURING_API_BASE=${TURING_API_BASE} \
         TURING_API_KEY=${TURING_API_KEY} \
         TURING_MODEL=${TURING_MODEL} \
         OPENAI_API_KEY=${OPENAI_API_KEY} \
         OPENAI_BASE_URL=${OPENAI_BASE_URL} \
         OPENAI_MODEL=${OPENAI_MODEL} \
         OPENAI_API=${OPENAI_API} \
         MCP_SERVER_URL=${MCP_SERVER_URL} \
         MCP_SERVER_NAME=${MCP_SERVER_NAME} \
         MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN} \
         MCP_TIMEOUT_MS=${MCP_TIMEOUT_MS} \
         FLUXINK_HWR_UI_RESOURCE_URI=${FLUXINK_HWR_UI_RESOURCE_URI} \
         PORTAL_FRAME_ANCESTOR_ORIGIN=${PORTAL_FRAME_ANCESTOR_ORIGIN} \
         bash ${STAGING_DEPLOY_PATH}/remote-deploy.sh"
  environment:
    name: staging
    url: $STAGING_PUBLIC_URL
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: manual
